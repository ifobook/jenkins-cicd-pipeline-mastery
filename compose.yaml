services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-cicd
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - jenkins_home:/var/jenkins_home

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  jenkins_home:
